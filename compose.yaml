services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Persist settings.php and any uploaded files written to the app directory
      - app_data:/var/www/html/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbwebgen}
      POSTGRES_USER: ${POSTGRES_USER:-dbwebgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbwebgen}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbwebgen}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  db_data:
