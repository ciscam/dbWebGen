<VirtualHost *:80>
    # Serve the app directory as the document root
    DocumentRoot /var/www/html/app

    # Expose the engine's static assets (JS, CSS) under /engine/
    Alias /engine /var/www/html/engine

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
